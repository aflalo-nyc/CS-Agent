# Finished-garment measurements from Production's size folder.
# Generated from the Drive folder in _meta.source_folder — see SIZING.md before using.
# Values in measurements_in are INCHES. Styles converted from cm keep the original
# under measurements_cm so nothing is lost to rounding.

_meta:
  source_folder: https://drive.google.com/drive/folders/1genAmeiLls_iITRbGPVU6TAxDcOOwo7D
  provided_by: Production
  imported: '2026-08-21'
  measurement_basis: FINISHED GARMENT, not body measurements
  styles_available: 8
  styles_withheld: 3
usage_policy:
  may_quote_garment_measurements: true
  may_recommend_a_size: false
  why: These are finished-garment measurements. Quoting one is a fact and is checkable. Turning it into
    'you should take a 6' requires her body measurements, an ease assumption, and a judgement about how
    she likes things to fit — none of which we have. A wrong size recommendation costs a return and the
    customer's confidence, so the drafter states measurements and lets her choose.
  always_state_units: true
  always_say_it_is_the_garment_not_the_body: true
